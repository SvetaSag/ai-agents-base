[project]
name = "lesson3-a2a-langfuse"
version = "0.1.0"
description = "Lesson 3: several agents talking over A2A, observed with Langfuse"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "mcp>=1.9",
    "langchain-mcp-adapters>=0.3",
    "a2a-sdk[http-server]>=1.2",
    "langfuse>=4.0",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["jupyterlab>=4", "ipykernel>=6"]

[tool.uv]
package = false
