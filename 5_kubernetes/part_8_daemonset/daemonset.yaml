apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      # DaemonSet поднимает ровно ПО ОДНОМУ поду на каждую ноду.
      # На 3-нодовом minikube получится 3 пода (по одному на minikube / m02 / m03).
      containers:
        - name: agent
          image: nginx:alpine
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
