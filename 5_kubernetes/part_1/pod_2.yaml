apiVersion: v1
kind: Pod
metadata:
  name: hse-pod-2
  labels:
    app: frontend
spec:
  containers:
  - name: hse-pod-2
    image: aesedeu/nginx-hse-ai:1.0  
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
