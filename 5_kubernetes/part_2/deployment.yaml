apiVersion: apps/v1
kind: Deployment
metadata:
  name: hse-deployment-2
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector: # подбирает pod-ы с такими же лейблами
    matchLabels:
      app: backend
  template: # шаблон для создания pod-ов
    metadata:
      labels:
        app: backend
    spec:
      # nodeSelector:
      #   load: high
      containers:
      - name: hse-pod-backend
        image: nginx:latest
        # image: httpd:latest
        resources:
          limits:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
        
