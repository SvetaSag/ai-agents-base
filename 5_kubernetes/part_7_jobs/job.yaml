apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
spec:
  completions: 3      # задача должна успешно завершиться 3 раза
  parallelism: 1      # по одному поду за раз
  backoffLimit: 2     # сколько раз ретраить при падении
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: registry.k8s.io/busybox
          command:
            - sh
            - -c
            - "echo Работаю; for i in 1 2 3; do echo шаг $i; sleep 1; done; echo Готово"
