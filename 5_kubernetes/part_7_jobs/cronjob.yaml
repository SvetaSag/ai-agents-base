apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
spec:
  schedule: "*/1 * * * *"        # каждую минуту
  successfulJobsHistoryLimit: 3  # сколько завершённых Job хранить
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: registry.k8s.io/busybox
              command: [sh, -c, "date; echo Привет из CronJob"]
