apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-backend-metrics
  namespace: monitoring
  labels:
    app: vllm-backend
spec:
  selector:
    matchLabels:
      app: vllm-backend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-backend-metrics
  namespace: monitoring
  labels:
    app: vllm-backend
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  selector:
    app: vllm-backend
