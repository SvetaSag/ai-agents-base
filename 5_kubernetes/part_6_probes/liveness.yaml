apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  labels:
    app: liveness
spec:
  containers:
    - name: liveness
      image: registry.k8s.io/busybox
      # создаём файл, через 30с удаляем — проба начнёт падать, kubelet перезапустит контейнер
      args:
        - /bin/sh
        - -c
        - touch /tmp/healthy; sleep 30; rm -f /tmp/healthy; sleep 600
      livenessProbe:
        exec:
          command: [cat, /tmp/healthy]
        initialDelaySeconds: 5
        periodSeconds: 5
