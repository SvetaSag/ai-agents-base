apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  labels:
    app: readiness
spec:
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
      # readiness: пока не отвечает 200 на "/", под НЕ получает трафик (0/1 Ready)
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
      # liveness: если перестанет отвечать — перезапуск
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
