apiVersion: apps/v1
kind: Deployment
metadata:
  name: hse-deployment-3
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector: # подбирает pod-ы с такими же лейблами
    matchLabels:
      app: frontend
  template: # шаблон для создания pod-ов
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: hse-pod
        # image: nginx:latest
        image: aesedeu/nginx-hse-ai:1.0
        imagePullPolicy: Always
        env:
        - name: POD_NAME # необходимо чтобы в webui отобразились имена POD
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: password
        resources:
          limits:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: my-config
        
