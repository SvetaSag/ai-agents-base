<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank analyst</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --navy:#21285C; --navy2:#2B3470; --coral:#F76266; --bg:#F4F5F9; --muted:#6E7391; --line:#E2E4EE; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:#262F56;
         display:grid; grid-template-columns:290px 1fr; height:100vh; }
  aside { background:var(--navy); color:#fff; display:flex; flex-direction:column; min-height:0; }
  aside header { padding:18px 18px 10px; font-weight:700; font-size:17px; }
  aside header small { display:block; font-weight:400; color:#A7ACC9; font-size:12px; }
  #new { margin:6px 14px 10px; padding:9px; border:0; border-radius:8px; background:var(--coral); color:#fff;
         font-weight:600; cursor:pointer; }
  #sessions { overflow-y:auto; padding:0 8px 12px; flex:1; }
  .s { padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px; }
  .s:hover { background:var(--navy2); }
  .s.active { background:#3A4488; }
  .s .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
  .s .m { color:#A7ACC9; font-size:12px; }
  main { display:flex; flex-direction:column; min-height:0; }
  #head { padding:14px 24px; border-bottom:1px solid var(--line); background:#fff; font-weight:600; }
  #head span { color:var(--muted); font-weight:400; font-size:13px; margin-left:8px; }
  #chat { flex:1; overflow-y:auto; padding:20px 24px; }
  .msg { max-width:820px; margin:0 auto 14px; padding:12px 16px; border-radius:12px; background:#fff;
         box-shadow:0 1px 3px rgba(33,40,92,.08); overflow-x:auto; }
  .msg.user { background:var(--navy); color:#fff; margin-left:auto; max-width:620px; }
  .msg.error { background:#FDE8E9; color:#9B1C21; }
  .msg table { border-collapse:collapse; margin:6px 0; font-size:14px; }
  .msg th, .msg td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  .msg p { margin:6px 0; }
  .tools { margin-bottom:6px; }
  .tools details { display:inline-block; margin:0 6px 4px 0; font-size:12px; color:var(--muted); }
  .tools summary { cursor:pointer; background:var(--bg); border-radius:6px; padding:2px 8px; list-style:none; }
  .tools pre { white-space:pre-wrap; background:#1A1F45; color:#E7E9F5; padding:8px; border-radius:6px; max-width:700px; }
  .empty { color:var(--muted); text-align:center; margin-top:18vh; }
  form { display:flex; gap:10px; padding:14px 24px; background:#fff; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
             font:inherit; height:48px; }
  button[type=submit] { border:0; border-radius:10px; padding:0 22px; background:var(--navy); color:#fff;
                        font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  @media (max-width:760px) { body { grid-template-columns:1fr; } aside { display:none; } }
</style>
</head>
<body>
<aside>
  <header>🏦 Bank analyst<small>LangGraph · MCP · Postgres</small></header>
  <button id="new">+ Новая сессия</button>
  <div id="sessions"></div>
</aside>
<main>
  <div id="head">Выберите сессию или начните новую</div>
  <div id="chat"><div class="empty">Спросите что-нибудь о данных банка — например,<br>
    «сколько у банка клиентов?» или «расскажи про счёт 2378».</div></div>
  <form id="form">
    <textarea id="input" placeholder="Сообщение… (Enter — отправить, Shift+Enter — перенос)"></textarea>
    <button type="submit" id="send">Отправить</button>
  </form>
</main>
<script>
const ICON = { web: "🌐", telegram: "✈️" };
let current = null;          // current session id
let busy = false;

const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
};
function md(text) {   // markdown → safe HTML (falls back to plain text if the CDN is unavailable)
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || ""));
  const div = document.createElement("div"); div.textContent = text || ""; return div.innerHTML;
}
function esc(text) { const d = document.createElement("div"); d.textContent = text; return d.innerHTML; }
function toolChip(t) {
  const body = t.args && t.args.query ? t.args.query : JSON.stringify(t.args || {}, null, 1);
  return `<details><summary>🔧 ${esc(t.name)}</summary><pre>${esc(body)}</pre></details>`;
}

async function loadSessions() {
  const sessions = await api("/api/sessions");
  $("sessions").innerHTML = sessions.map((s) => `
    <div class="s ${s.id === current ? "active" : ""}" data-id="${s.id}">
      <div class="t">#${s.id} ${ICON[s.source] || ""} ${esc(s.title || "без названия")}</div>
      <div class="m">${new Date(s.updated_at).toLocaleString("ru")}</div>
    </div>`).join("");
  for (const el of document.querySelectorAll(".s")) el.onclick = () => openSession(+el.dataset.id);
}

async function openSession(id) {
  current = id; location.hash = id;
  const [session, messages] = await Promise.all([api(`/api/sessions/${id}`), api(`/api/sessions/${id}/messages`)]);
  $("head").innerHTML = `Сессия #${id}<span>${ICON[session.source] || ""} начата в ${session.source === "telegram" ? "Telegram" : "веб-чате"} · в Telegram: /continue ${id}</span>`;
  $("chat").innerHTML = messages.length ? "" : `<div class="empty">Пустая сессия — напишите первое сообщение.</div>`;
  for (const m of messages) addMessage(m.role, m.content, m.tools || []);
  loadSessions();
}

function addMessage(role, content, tools = []) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = (tools.length ? `<div class="tools">${tools.map(toolChip).join("")}</div>` : "")
               + `<div class="body">${role === "user" ? esc(content) : md(content)}</div>`;
  const empty = $("chat").querySelector(".empty"); if (empty) empty.remove();
  $("chat").appendChild(el); $("chat").scrollTop = $("chat").scrollHeight;
  return el;
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; $("send").disabled = true;
  if (current === null) { const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ source: "web" }) }); await openSession(s.id); }
  addMessage("user", text);
  const bubble = addMessage("assistant", "думаю…");
  try {
    const reply = await api(`/api/sessions/${current}/chat`, { method: "POST", body: JSON.stringify({ text, source: "web" }) });
    bubble.remove();
    addMessage("assistant", reply.answer, reply.tools);
  } catch (err) { bubble.classList.add("error"); bubble.querySelector(".body").textContent = "Ошибка: " + err.message; }
  busy = false; $("send").disabled = false; loadSessions();
}

$("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; send(t); };
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
$("new").onclick = async () => { const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ source: "web" }) }); openSession(s.id); };

loadSessions().then(() => { const id = parseInt(location.hash.slice(1)); if (id) openSession(id); });
setInterval(loadSessions, 4000);   // sessions started in Telegram show up here by themselves
</script>
</body>
</html>
