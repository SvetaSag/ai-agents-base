# Снаружи доступен только риск-менеджер: http://risk.agents.test
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risk-manager
  annotations:
    # агент думает дольше 60 с (таймаут nginx по умолчанию) — даём до 5 минут
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: risk.agents.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: risk-manager
            port:
              number: 8103
