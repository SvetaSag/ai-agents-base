# Ingress — вход снаружи по домену: http://agents.test → Service hello-agent
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents
spec:
  ingressClassName: nginx
  rules:
  - host: agents.test                # в /etc/hosts: <minikube ip> agents.test  (make hosts)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello-agent        # название сервиса
            port:
              number: 80             # порт сервиса
