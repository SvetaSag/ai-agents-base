# DaemonSet — ровно по одному поду на КАЖДОЙ ноде
# (в жизни: сборщик логов, агент мониторинга, кэш моделей на ноде)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: agent
        image: hello-agent:1
        env:
        - name: AGENT_NAME
          value: node-agent
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
