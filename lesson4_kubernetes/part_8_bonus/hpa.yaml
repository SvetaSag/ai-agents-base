# HPA — автоскейлинг: держим загрузку CPU агентов около 50%, от 1 до 5 реплик
# (берёт метрики из metrics-server; считает % от requests.cpu — без requests HPA не работает)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busy-agent
  template:
    metadata:
      labels:
        app: busy-agent
    spec:
      containers:
      - name: agent
        image: hello-agent:1
        env:
        - name: AGENT_NAME
          value: busy-agent
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 100m, memory: 32Mi}    # 50% от этого = 50m
          limits: {cpu: 300m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: busy-agent
spec:
  selector:
    app: busy-agent
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: busy-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: busy-agent
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
