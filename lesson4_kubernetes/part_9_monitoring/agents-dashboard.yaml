# Свой дашборд Grafana. Sidecar Grafana сам подхватывает ConfigMap'ы с меткой grafana_dashboard: "1".
# Внутри — «голый» JSON дашборда. Запросы без фильтра container!="": в minikube cAdvisor отдаёт метрики
# только на уровне пода (поэтому часть стандартных дашбордов здесь пустая).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  agents.json: |
    {
      "uid": "agents",
      "title": "Агенты в кластере",
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries",
          "title": "Память подов агентов",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\", pod=~\"(analyst|risk-manager|bank-mcp|bank-db).*\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU подов агентов",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\", pod=~\"(analyst|risk-manager|bank-mcp|bank-db).*\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Готовые реплики",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"default\", deployment=~\"analyst|risk-manager|bank-mcp|bank-db\"}",
              "legendFormat": "{{deployment}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Перезапуски контейнеров",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"default\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
